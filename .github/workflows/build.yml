name: Build Mithaq APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android Files
        run: flutter create . --platforms=android --project-name mithaq

      - name: Fix Internet Permission (صلاحية النت)
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Add App Logo (إضافة الشعار تلقائياً)
        run: |
          mkdir -p assets
          # تحميل شعار ميزان العدالة
          curl -L -o assets/icon.png "https://cdn-icons-png.flaticon.com/512/1048/1048953.png"
          # استخدام أداة ImageMagick لتوليد جميع مقاسات الأيقونات لهواتف الأندرويد
          sudo apt-get install -y imagemagick
          convert assets/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Generate Keystore (توقيع التطبيق)
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mithaq -storepass mithaq123 -keypass mithaq123 -dname "CN=Mithaq, OU=Dev, O=Mithaq, L=Gaza, S=Gaza, C=PS"
          echo "storePassword=mithaq123" > android/key.properties
          echo "keyPassword=mithaq123" >> android/key.properties
          echo "keyAlias=mithaq" >> android/key.properties
          echo "storeFile=../release.jks" >> android/key.properties

      - name: Patch Gradle for Signing (تجهيز ملفات البناء)
        run: |
          python3 -c "
          import re
          with open('android/app/build.gradle.kts', 'r') as f: content = f.read()
          content = content.replace('android {', 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\nandroid {', 1)
          content = content.replace('buildTypes {', 'signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties[\"keyAlias\"] as String\n            keyPassword = keystoreProperties[\"keyPassword\"] as String\n            storeFile = keystoreProperties[\"storeFile\"]?.let { file(it) }\n            storePassword = keystoreProperties[\"storePassword\"] as String\n        }\n    }\n    buildTypes {', 1)
          content = content.replace('getByName(\"release\") {', 'getByName(\"release\") {\n                signingConfig = signingConfigs.getByName(\"release\")', 1)
          with open('android/app/build.gradle.kts', 'w') as f: f.write(content)
          "

      - name: Build Signed APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
