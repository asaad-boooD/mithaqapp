name: Build Mithaq APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Clean Flutter Cache
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android Files
        run: flutter create . --platforms=android --project-name mithaq

      - name: Fix Internet Permission
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Add App Logo (الشعار الرسمي)
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png "https://cdn-icons-png.flaticon.com/512/1048/1048953.png"
          dart run flutter_launcher_icons

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mithaq -storepass mithaq123 -keypass mithaq123 -dname "CN=Mithaq, OU=Dev, O=Mithaq, L=Gaza, S=Gaza, C=PS"
          echo "storePassword=mithaq123" > android/key.properties
          echo "keyPassword=mithaq123" >> android/key.properties
          echo "keyAlias=mithaq" >> android/key.properties
          echo "storeFile=release.jks" >> android/key.properties

      - name: Patch Gradle for Signing and NDK
        run: |
          python3 -c "
          import re
          with open('android/app/build.gradle.kts', 'r') as f: content = f.read()
          content = content.replace('plugins {', 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\nplugins {')
          content = content.replace('android {', 'android {\n    ndkVersion = \"27.0.12077973\"\n    signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties[\"keyAlias\"] as String\n            keyPassword = keystoreProperties[\"keyPassword\"] as String\n            storeFile = keystoreProperties[\"storeFile\"]?.let { file(it) }\n            storePassword = keystoreProperties[\"storePassword\"] as String\n        }\n    }')
          content = content.replace('signingConfig = signingConfigs.getByName(\"debug\")', 'signingConfig = signingConfigs.getByName(\"release\")')
          with open('android/app/build.gradle.kts', 'w') as f: f.write(content)
          "

      - name: Build Signed APK
        run: flutter build apk --release --obfuscate --split-debug-info=debug_info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
